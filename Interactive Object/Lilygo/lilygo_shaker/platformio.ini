; PlatformIO front-end for Cursor build/upload.
; Source of truth stays the Arduino sketch — clients can open lilygo_shaker.ino in Arduino IDE.
; Install the "PlatformIO IDE" extension in Cursor, then use Build / Upload on this folder.

[platformio]
src_dir = .
default_envs = esp32-s3-devkitc-1

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	tzapu/WiFiManager@^2.0.17
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TFT_eWidget@^0.0.6
; Ignore PlatformIO cache / VCS if present under the sketch tree.
build_src_filter =
	+<*>
	-<.git/>
	-<.pio/>
; Match Interactive Object/lib TFT setup (TTGO Setup25) without editing the library.
; helpers.cpp / ui.cpp still need TFT_eSPI color constants on both boards.
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DCGRAM_OFFSET=1
	-DTFT_MISO=-1
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=6000000

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
; Match board_select.h ACTIVE_BOARD = BOARD_ESP32_S3_DEVKITC_1 (default).
; Native USB (VID 303A) is USB-Serial/JTAG: upload works without CDC, but Serial.print
; does not — enable CDC so the same COM port shows the boot banner / debug / RDCC.
; Arduino IDE equivalent: Tools → USB CDC On Boot → Enabled.
; Alternative: leave CDC off and monitor the UART USB jack instead.
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:ttgo-t-display]
platform = espressif32
board = esp32dev
; Before building this env, set ACTIVE_BOARD to BOARD_TTGO_T_DISPLAY in board_select.h.
